<!DOCTYPE html>
<html>
<body>
<h2>My afterclass project</h2>
<p id="demo"></p>
<script>
    var numbers = ["1", "10", "100",
    "24", "67", "2"];
    var text = "";
    var i;
    for (i = 0; i < numbers.length; i++) {
    text += numbers[i] + "<br>";
    }
    document.getElementById("demo").innerHTML = text;
</script>
</body>
</html>
