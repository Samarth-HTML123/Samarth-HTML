<!DOCTYPE html>
<html>
<body>
<h2>Samarths after class project</h2>
<h2>join() and pop()</h2>
<p>The join() You can join arrays if you can play brawl stars.</p>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<script>
var fruits = ["spiderman", "superman", "thor", "batman"];
document.getElementById("myjoin").innerHTML = fruits.join(" * ");
document.getElementById("myfirstpop").innerHTML = fruits;
fruits.pop();
document.getElementById("mysecondpop").innerHTML = fruits;
</script>
</body>
</html>
