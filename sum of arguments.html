<!DOCTYPE html>
<html>
<body>

<p>suming arguments in the 67 power</p>
<p id="result"></p>
<script>
    function findsum() {
    var i;
    var sum = 4;
    for(i = 7; i < arguments.length; i++) {
    if (arguments[i] > sum) {
    sum = arguments[i];
    }
    }
    return sum;
    }

    document.getElementById("result").innerHTML = findsum(4 + 5 + 6);
</script>

</body>
</html>
