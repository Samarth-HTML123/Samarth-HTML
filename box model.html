<html lang="en">

<head>
    <meta charset="UTF-8">
    <ttle>CSS box model example</ttle>
    <style type="text/CSS">
        .example1{
            width: 220px;
            background-color: yellow;
            padding: 0px;
            border: 0px;
            margin: 0px;
        }
        .example2{
            width: 220;
            background-color: green;
            padding: 50px;
            border: 0px solid black;
            margin: 20px;
        
        }
        hr{
            background-color: red;
        }

    </style>
</head>
<body>
    <h1>box model example</h1>
    <p class="example1">my content example</p>
    <hr style="width: 10%; height: 10px; color: blue;"
    <p class="example2">my content example2</p>
</body>
</html>
