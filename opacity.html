<html>
    <head> 
        <style>
            div{
                background-color: blue;
                padding: 10px;
            }
            div.first{
                opacity: 0.1;
            }
            div.second{
                opacity: 0.3;
            }
            div.third{
                opacity: 0.6;
            }
        </style>
    </head>
    <body>
        <h1>the Opacity properties
        </h1>
        <p> Opacity is the transperancy of some thing</p>
        <div class="first">0.1</div>
        <div class="second">0.3</div>
        <div class="third">0.6</div>
        <div class="default">default</div>
    </body>
</html>
