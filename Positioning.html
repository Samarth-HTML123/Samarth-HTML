<html>
<head>
    <style>
        div{
            right: 30px;
            border: 3px solid #73AD21;
        }
        div.absolute{
            position: absolute;
            left: 50px;
            border: 3px solid blue;

        }
        div.relative{
            position: relative;
            left: 100px;
            border: 3px solid #73AD21;
        }
        div.fixed{
            position: fixed;
            top: 0;
            left: 20px;
            width: 300px;
            border: 3px solid #73AD21;
        }
        div.sticky{
            position: sticky;
            left: 200px;
            border: 3px solid #73AD21;
        }
        
    </style>
</head>
<body>
    <h2>positioning</h2>
    <div>
        I like Brawl Stars ezezezez
    </div>
    <div class="sticky"> Rico is the Best Brawler in the game</div>
    <div class="relative">But Buzz is the worst Brawler in the game</div>
    <div class="fixed">Time to cook with Rico</div>
    <div class="absolute">I am gonna get rico prestige 3</div>
</body>
</html>
