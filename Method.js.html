<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript Arrays methods</h2>
        <h2>Join () to get 1B dollas</h2>
        <p>The join() method joins array elements into a string and the pop() method removes the last element from an array.</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruit = ["Banana","Orange","Grapes","Jack fruit","Strawberry","Mango"]
            document.getElementById("myjoin").innerHTML = fruit.join(" * ");
            document.getElementById("myfirstpop").innerHTML = fruit; fruit.pop();
            document.getElementById("mysecondpop").innerHTML = fruit; 

        </script>
    </body>
</html>
